name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build against iOS Simulator
        run: >
          xcodebuild
          -project BookFold.xcodeproj
          -scheme BookFold
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build

      - name: Unit tests (geometry, pipeline, persistence)
        run: >
          xcodebuild
          -project BookFold.xcodeproj
          -scheme BookFold
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Offline guard (no networking APIs, no tracking SDKs, no dependencies)
        run: ./scripts/check-no-network.sh
