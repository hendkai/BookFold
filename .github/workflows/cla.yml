name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# explicitly configure permissions, in case GITHUB_TOKEN workflow permissions
# are set to read-only in repository settings
permissions:
  actions: write
  contents: write # this can be 'read' if the signatures are in a remote repository
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PERSONAL_ACCESS_TOKEN is only needed when signatures are stored in
          # a remote repository — BookFold stores them in this repo.
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/hendkai/BookFold/blob/main/.cla/CLA-INDIVIDUAL.md'
          branch: 'main'
          allowlist: 'hendkai,github-actions[bot],dependabot[bot],renovate[bot]'
          custom-notsigned-prcomment: 'Thanks for your contribution! Before we can merge it, please sign our CLA (contributor license agreement — it keeps BookFold free and dual-licensable). **Individuals:** read [CLA-INDIVIDUAL.md](https://github.com/hendkai/BookFold/blob/main/.cla/CLA-INDIVIDUAL.md), then comment below with exactly: `I have read the CLA Document and I hereby sign the CLA` **Contributing for a company?** Read [CLA-CORPORATE.md](https://github.com/hendkai/BookFold/blob/main/.cla/CLA-CORPORATE.md) and contact snailberg@kaiser-mail.de for countersigned terms.'
          signed-commit-message: '$contributorName has signed the CLA in $owner/$repo#$pullRequestNo'
